name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://nava:nava@localhost:5432/nava
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nava
          POSTGRES_PASSWORD: nava
          POSTGRES_DB: nava
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nava -d nava"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: DATABASE_URL=postgresql://nava:nava@localhost:5432/nava alembic upgrade head
      - run: ruff check app tests
      - run: mypy app/core/security.py app/core/config.py app/services/order_service.py app/services/payment_service.py app/services/notification_service.py app/services/verification_service.py --follow-imports=skip
      - run: pytest --cov=app/services --cov=app/core --cov-fail-under=80
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nava:ci
