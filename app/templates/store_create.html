<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Store - AI Sales Assistant</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-3xl mx-auto px-6 py-8">

        <!-- Header -->
        <div class="mb-8">

            <a
                href="/dashboard"
                class="text-sm text-blue-600 hover:text-blue-800"
            >
                ← Back to Dashboard
            </a>

            <h1 class="text-3xl font-bold text-gray-900 mt-4">
                Create Store
            </h1>

            <p class="text-gray-600 mt-2">
                Create your store and start adding products.
            </p>

        </div>


        <!-- Form -->
        <div class="bg-white rounded-xl shadow p-6">

            <form
                method="post"
                action="/stores/new"
                class="space-y-6"
            >

                <!-- Store Name -->
                <div>

                    <label
                        for="name"
                        class="block text-sm font-medium text-gray-700 mb-2"
                    >
                        Store Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        placeholder="My Store"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    >

                </div>


                <!-- Description -->
                <div>

                    <label
                        for="description"
                        class="block text-sm font-medium text-gray-700 mb-2"
                    >
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="Describe your store..."
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    ></textarea>

                </div>


                <!-- Business Type -->
                <div>

                    <label
                        for="business_type"
                        class="block text-sm font-medium text-gray-700 mb-2"
                    >
                        Business Type
                    </label>

                    <select
                        id="business_type"
                        name="business_type"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    >
                        <option value="" disabled selected>Select a business type</option>
                        {% for business in business_types %}
                            <option value="{{ business.slug }}">
                                {{ business.label }}
                            </option>
                        {% endfor %}
                    </select>

                </div>


                <!-- Actions -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t">

                    <a
                        href="/dashboard"
                        class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
                    >
                        Create Store
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
