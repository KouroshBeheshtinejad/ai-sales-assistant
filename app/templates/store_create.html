{% extends "base.html" %}
{% block title %}New store · Nava{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl"><a href="/dashboard" class="text-sm font-bold text-slate-500 hover:text-ink">← Back to overview</a><div class="mt-8"><p class="text-sm font-bold uppercase tracking-[.18em] text-coral">New workspace</p><h1 class="display mt-2 text-4xl font-extrabold tracking-tight text-ink">Create a store that fits.</h1><p class="mt-3 text-slate-500">Choose your business type and we’ll shape the product fields around it.</p></div><form method="post" action="/stores/new" class="mt-8 rounded-3xl bg-white p-6 shadow-soft md:p-9"><div class="grid gap-6 md:grid-cols-2"><label class="block md:col-span-2"><span class="mb-2 block text-sm font-bold">Store name</span><input name="name" required placeholder="e.g. Northside Kitchen" class="w-full rounded-xl border border-slate-200 px-4 py-3.5 outline-none focus:border-coral focus:ring-4 focus:ring-coral/10"></label><label class="block md:col-span-2"><span class="mb-2 block text-sm font-bold">Business type</span><select name="business_type" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 outline-none focus:border-coral focus:ring-4 focus:ring-coral/10"><option value="" disabled selected>Select the closest fit</option>{% for business in business_types %}<option value="{{ business.slug }}">{{ business.label }}</option>{% endfor %}</select></label><label class="block md:col-span-2"><span class="mb-2 block text-sm font-bold">Short description <span class="font-normal text-slate-400">Optional</span></span><textarea name="description" rows="4" placeholder="What makes this store special?" class="w-full resize-none rounded-xl border border-slate-200 px-4 py-3.5 outline-none focus:border-coral focus:ring-4 focus:ring-coral/10"></textarea></label></div><div class="mt-8 flex flex-col-reverse gap-3 border-t border-slate-100 pt-6 sm:flex-row sm:justify-end"><a href="/dashboard" class="rounded-xl px-5 py-3 text-center text-sm font-bold text-slate-500 hover:bg-slate-50">Cancel</a><button class="rounded-xl bg-coral px-6 py-3 font-bold text-white shadow-lg shadow-coral/20 hover:bg-orange-600">Create store <span class="ml-2">→</span></button></div></form></div>
{% endblock %}
