{% extends "base.html" %}
{% block title %}Edit {{ store.name }} · Nava{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl"><a href="/stores/{{ store.id }}/manage" class="text-sm font-bold text-slate-500 hover:text-ink">← Back to store</a><div class="mt-8"><p class="text-sm font-bold uppercase tracking-[.18em] text-coral">Store settings</p><h1 class="display mt-2 text-4xl font-extrabold tracking-tight text-ink">Tune your workspace.</h1></div><form method="post" action="/stores/{{ store.id }}/edit" class="mt-8 rounded-3xl bg-white p-6 shadow-soft md:p-9"><div class="space-y-6"><label class="block"><span class="mb-2 block text-sm font-bold">Store name</span><input name="name" value="{{ store.name }}" required class="w-full rounded-xl border border-slate-200 px-4 py-3.5 outline-none focus:border-coral focus:ring-4 focus:ring-coral/10"></label><label class="block"><span class="mb-2 block text-sm font-bold">Business type</span><select name="business_type" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3.5 outline-none focus:border-coral focus:ring-4 focus:ring-coral/10">{% for business in business_types %}<option value="{{ business.slug }}" {% if business.slug == store.business_type %}selected{% endif %}>{{ business.label }}</option>{% endfor %}</select></label><label class="block"><span class="mb-2 block text-sm font-bold">Description</span><textarea name="description" rows="4" class="w-full resize-none rounded-xl border border-slate-200 px-4 py-3.5 outline-none focus:border-coral focus:ring-4 focus:ring-coral/10">{{ store.description or "" }}</textarea></label></div><div class="mt-8 flex flex-col-reverse gap-3 border-t border-slate-100 pt-6 sm:flex-row sm:justify-end"><a href="/stores/{{ store.id }}/manage" class="rounded-xl px-5 py-3 text-center text-sm font-bold text-slate-500 hover:bg-slate-50">Cancel</a><button class="rounded-xl bg-ink px-6 py-3 font-bold text-white hover:bg-slate-700">Save changes <span class="ml-2">→</span></button></div></form></div>
{% endblock %}
